inherit: base.yaml
name: ae
task: autoencoder
model: ae
seeds: [0, 1, 2]
params:
  hidden: [32, 16]
  latent_dim: 4
  lr: 0.003            # still improving at the old 200-epoch cap; faster lr + early stopping
  max_epochs: 2000
  patience: 30
  anomaly_quantile: 0.99   # threshold on training reconstruction error
