inherit: base.yaml
name: freq_lgbm
task: frequency
model: lgbm
seeds: [0, 1, 2, 3, 4]
# Random search on validation deviance (seed 0); the best configuration is then refitted
# with every seed. Results of all trials: artifacts/freq_lgbm/search.csv
search:
  n_trials: 20
  seed: 0
  space:
    learning_rate: [0.01, 0.02, 0.03, 0.05, 0.1]
    num_leaves: [7, 15, 31, 63, 127]
    min_child_samples: [50, 100, 200, 500, 1000]
    subsample: [0.6, 0.7, 0.8, 0.9, 1.0]
    colsample_bytree: [0.5, 0.7, 0.8, 0.9, 1.0]
    reg_lambda: [0.0, 0.1, 1.0, 5.0, 10.0]
    min_split_gain: [0.0, 0.001, 0.01]
params:
  objective: poisson
  subsample_freq: 1
  n_estimators: 10000
  early_stopping_rounds: 100
